<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
            padding: 32px 28px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            margin: 0 0 20px;
            color: #52606d;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cbd2d9;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px 14px;
            background: #334e68;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <h1>비밀번호 재설정</h1>
        <p>새 비밀번호를 입력하면 기존 재설정 링크는 더 이상 사용할 수 없습니다.</p>

        <div th:if="${error != null}" class="message error" th:text="${error}"></div>
        <div th:if="${success != null}" class="message success" th:text="${success}"></div>

        <form th:if="${success == null}" method="post" action="/api/auth/password-reset">
            <input type="hidden" name="token" th:value="${token}">

            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" name="newPassword" type="password" minlength="8" required>

            <label for="confirmPassword">새 비밀번호 확인</label>
            <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required>

            <button type="submit">비밀번호 변경</button>
        </form>
    </div>
</div>
</body>
</html>
